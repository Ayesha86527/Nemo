[project]
name = "nemo-backend"
version = "0.2.0"
description = "Nemo AI Career Co-Pilot — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "httpx>=0.27.0",
    "python-docx>=1.1.0",
    "python-multipart>=0.0.9",
    "pypdf>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
# Fully local voice input (faster-whisper runs on-device; model downloads once
# to ~/.nemo/models and recordings never leave the machine).
voice = [
    "faster-whisper>=1.0.0",
]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"
